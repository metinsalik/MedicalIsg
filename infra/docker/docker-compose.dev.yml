# Medical ISG Full System Stack (Local Development & Demo)
# Tek komutla tüm altyapı ve frontend Nginx container içinde çalışır:
# docker compose -f infra/docker/docker-compose.dev.yml up --build -d

services:
  # 1. FRONTEND WEB & NGINX REVERSE PROXY
  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: isg_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - isg_internal_net

  # 2. VERİTABANI MOTORU (PostgreSQL 16)
  postgres:
    image: postgres:16-alpine
    container_name: isg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-isg_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isg_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-medical_isg_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-isg_admin} -d ${POSTGRES_DB:-medical_isg_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - isg_internal_net

  # 3. KUYRUK & CACHE (Redis 7)
  redis:
    image: redis:7-alpine
    container_name: isg_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-isg_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-isg_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - isg_internal_net

  # 4. DEPOLAMA (MinIO S3)
  minio:
    image: elestio/minio:latest
    container_name: isg_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-isg_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-isg_minio_secret_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - isg_internal_net

networks:
  isg_internal_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
